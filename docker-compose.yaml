# nginx proxy address - http://172.17.0.1:8084

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  discourse:
    image: discourse/discourse:latest
    container_name: discourse-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - discourse
    ports:
      - "8084:80"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/data/discourse:/data
      - ./volumes/config/discourse:/config
    depends_on:
      - discourse-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  discourse-db:
    image: postgres:16-alpine
    container_name: discourse-db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - discourse
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-discourse}
      POSTGRES_USER: ${DB_USER_NAME:-discourse}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/discourse:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  discourse:
    name: discourse
    external: false
