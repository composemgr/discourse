name: discourse
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: discourse/discourse:latest
    container_name: discourse-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: discourse-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      RAILS_ENV: production
      DISCOURSE_HOSTNAME: ${BASE_HOST_NAME:-discourse.example.com}
      DISCOURSE_DB_HOST: discourse-db
      DISCOURSE_DB_PORT: 5432
      DISCOURSE_DB_NAME: ${DB_CREATE_DATABASE_NAME:-discourse}
      DISCOURSE_DB_USERNAME: ${DB_USER_NAME:-discourse}
      DISCOURSE_DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      DISCOURSE_REDIS_HOST: discourse-redis
      DISCOURSE_REDIS_PORT: 6379
      DISCOURSE_SMTP_ADDRESS: ${EMAIL_SERVER_HOST:-172.17.0.1}
      DISCOURSE_SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      DISCOURSE_SMTP_USER_NAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      DISCOURSE_SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      DISCOURSE_SMTP_DOMAIN: ${BASE_DOMAIN_NAME:-example.com}
      DISCOURSE_SKIP_EMAIL_SETUP: ${DISCOURSE_SKIP_EMAIL_SETUP:-1}
    volumes:
      - './volumes/data/discourse:/var/www/discourse/shared:z'
    depends_on:
      discourse-db:
        condition: service_healthy
      discourse-redis:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.discourse-app.entrypoints=http'
      - 'traefik.http.routers.discourse-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.discourse-app.middlewares=discourse-app-https-redirect'
      - 'traefik.http.middlewares.discourse-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.discourse-app-secure.entrypoints=https'
      - 'traefik.http.routers.discourse-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.discourse-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.discourse-app-secure.service=discourse-app'
      - 'traefik.http.services.discourse-app.loadbalancer.server.port=80'
    networks:
      - discourse
      - traefik

  discourse-db:
    image: postgres:latest
    container_name: discourse-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: discourse-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: discourse-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-discourse}
      POSTGRES_USER: ${DB_USER_NAME:-discourse}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - './volumes/db/postgres/discourse:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - discourse

  discourse-redis:
    image: redis:alpine
    container_name: discourse-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: discourse-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: discourse-redis
    volumes:
      - './volumes/db/redis/discourse:/data:z'
    networks:
      - discourse


networks:
  discourse:
    name: discourse
    external: false
  traefik:
    external: true
